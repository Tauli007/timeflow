services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://timeflow:timeflow@db:5432/timeflow
      JWT_ACCESS_SECRET: change-access-secret
      JWT_REFRESH_SECRET: change-refresh-secret
      DEFAULT_ADMIN_EMAIL: admin@timeflow.local
      DEFAULT_ADMIN_PASSWORD: ChangeMe123!
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timeflow
      POSTGRES_USER: timeflow
      POSTGRES_PASSWORD: timeflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
