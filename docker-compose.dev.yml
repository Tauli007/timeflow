services:
  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm --workspace apps/web run dev"
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates && rm -rf /var/lib/apt/lists/* && npm install && npm --workspace apps/api run dev"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PRISMA_CLI_BINARY_TARGETS: ${PRISMA_CLI_BINARY_TARGETS:-debian-openssl-3.0.x}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeflow}
      POSTGRES_USER: ${POSTGRES_USER:-timeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeflow}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
