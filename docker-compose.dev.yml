services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm --workspace apps/web run dev"
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm --workspace apps/api run dev"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://timeflow:timeflow@db:5432/timeflow
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timeflow
      POSTGRES_USER: timeflow
      POSTGRES_PASSWORD: timeflow
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
